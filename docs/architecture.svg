<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d">
  <title id="t">fintech-fraud-detection architecture</title>
  <desc id="d">A client or load test sends POST /transaction requests to a Kubernetes Service (LoadBalancer port 80 to container port 8000, NodePort 31456 used in the demos). The Service spreads requests over 1 to 5 FastAPI pods of the transaction-processor Deployment in the fintech namespace. A Horizontal Pod Autoscaler adds pods when average CPU is above 50 percent of the 100m request and removes them when idle. Everything runs on k3s v1.34.4 across three Ubuntu 22.04 virtual machines (one control plane, two workers) on KVM/QEMU on a Nobara Linux laptop.</desc>
  <style>
    :root { --ink:#1f2937; --sub:#57606a; --line:#d0d7de; --card:#ffffff; --on:#2563eb; --tint:#eff6ff; --group:#f6f8fa; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e6edf3; --sub:#9198a1; --line:#3d444d; --card:#161b22; --on:#60a5fa; --tint:#172554; --group:#0d1117; }
    }
    text { font-family: Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size:14px; font-weight:700; fill:var(--ink); text-anchor:middle; }
    .sub   { font-size:11px; fill:var(--sub); text-anchor:middle; }
    .gt    { font-size:12px; font-weight:700; fill:var(--sub); letter-spacing:.04em; }
    .pill-t{ font-size:12px; font-weight:600; fill:var(--ink); text-anchor:middle; }
    .lbl   { font-size:10.5px; fill:var(--sub); text-anchor:middle; }
    .node  { fill:var(--card); stroke:var(--line); stroke-width:1.5; }
    .hot   { fill:var(--tint); stroke:var(--on); stroke-width:1.5; }
    .extra { fill:var(--card); stroke:var(--line); stroke-width:1.5; stroke-dasharray:5 4; }
    .group { fill:var(--group); stroke:var(--line); stroke-width:1.5; stroke-dasharray:5 4; }
    .ns    { fill:none; stroke:var(--line); stroke-width:1.5; stroke-dasharray:5 4; }
    .wire  { stroke:var(--line); stroke-width:1.5; fill:none; }
    .head  { fill:var(--line); }
    .flow  { stroke:var(--on); stroke-width:2; fill:none; stroke-dasharray:3 11; animation: dash 1.1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset:-14; } }
    .s2 { animation: up2 8s infinite; } .s3 { animation: up3 8s infinite; }
    .s4 { animation: up4 8s infinite; } .s5 { animation: up5 8s infinite; }
    @keyframes up2 { 0%,10% { opacity:.35; } 15%,80% { opacity:1; } 88%,100% { opacity:.35; } }
    @keyframes up3 { 0%,18% { opacity:.35; } 23%,80% { opacity:1; } 88%,100% { opacity:.35; } }
    @keyframes up4 { 0%,26% { opacity:.35; } 31%,80% { opacity:1; } 88%,100% { opacity:.35; } }
    @keyframes up5 { 0%,34% { opacity:.35; } 39%,80% { opacity:1; } 88%,100% { opacity:.35; } }
    @media (prefers-reduced-motion: reduce) { .flow, .s2, .s3, .s4, .s5 { animation:none; } }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0 L10 5 L0 10z"/></marker>
  </defs>

  <!-- host / cluster -->
  <rect class="group" x="200" y="14" width="745" height="326" rx="14"/>
  <text class="gt" x="218" y="36">KVM/QEMU ON NOBARA LINUX · k3s v1.34.4 · 3 UBUNTU 22.04 VMs</text>
  <rect class="node" x="218" y="48" width="230" height="34" rx="8"/><text class="pill-t" x="333" y="70">k3s-control · 2 vCPU · 3 GB</text>
  <rect class="node" x="462" y="48" width="230" height="34" rx="8"/><text class="pill-t" x="577" y="70">k3s-worker-1 · 3 vCPU · 4 GB</text>
  <rect class="node" x="706" y="48" width="222" height="34" rx="8"/><text class="pill-t" x="817" y="70">k3s-worker-2 · 3 vCPU · 4 GB</text>

  <!-- namespace -->
  <rect class="ns" x="218" y="98" width="710" height="226" rx="12"/>
  <text class="gt" x="234" y="118">NAMESPACE fintech</text>

  <!-- wires -->
  <g>
    <path class="wire" d="M165 211 H238" marker-end="url(#a)"/>  <path class="flow" d="M165 211 H236"/>
    <path class="wire" d="M408 211 C440 211 440 147 468 147" marker-end="url(#a)"/> <path class="flow" d="M408 211 C440 211 440 147 466 147"/>
    <path class="wire" d="M408 211 C440 211 440 181 468 181" marker-end="url(#a)"/>
    <path class="wire" d="M408 211 H468" marker-end="url(#a)"/>
    <path class="wire" d="M408 211 C440 211 440 249 468 249" marker-end="url(#a)"/>
    <path class="wire" d="M408 211 C440 211 440 283 468 283" marker-end="url(#a)"/>
    <path class="wire" d="M718 170 H674" marker-end="url(#a)"/>
    <path class="wire" d="M718 262 H674" marker-end="url(#a)"/>
  </g>
  <text class="lbl" x="200" y="202">HTTP</text>
  <text class="lbl" x="696" y="161">scales</text>
  <text class="lbl" x="696" y="253">owns</text>

  <!-- client -->
  <rect class="node" x="15" y="166" width="150" height="90" rx="12"/>
  <text class="title" x="90" y="196">Client</text>
  <text class="sub" x="90" y="216">curl / load test</text>
  <text class="sub" x="90" y="232">POST /transaction</text>

  <!-- service -->
  <rect class="node" x="240" y="160" width="168" height="102" rx="12"/>
  <text class="title" x="324" y="190">Service</text>
  <text class="sub" x="324" y="210">LoadBalancer :80 → 8000</text>
  <text class="sub" x="324" y="226">NodePort 31456</text>
  <text class="sub" x="324" y="242">(used in the demos)</text>

  <!-- pods -->
  <rect class="hot" x="470" y="133" width="204" height="28" rx="8"/><text class="pill-t" x="572" y="151">pod 1 · FastAPI · ≥$10k flag</text>
  <g class="s2"><rect class="extra" x="470" y="167" width="204" height="28" rx="8"/><text class="pill-t" x="572" y="185">pod 2 (added by HPA)</text></g>
  <g class="s3"><rect class="extra" x="470" y="201" width="204" height="28" rx="8"/><text class="pill-t" x="572" y="219">pod 3 (added by HPA)</text></g>
  <g class="s4"><rect class="extra" x="470" y="235" width="204" height="28" rx="8"/><text class="pill-t" x="572" y="253">pod 4 (added by HPA)</text></g>
  <g class="s5"><rect class="extra" x="470" y="269" width="204" height="28" rx="8"/><text class="pill-t" x="572" y="287">pod 5 (added by HPA)</text></g>
  <text class="lbl" x="572" y="314">each reply says handled_by: &lt;pod&gt;</text>

  <!-- HPA + Deployment -->
  <rect class="node" x="720" y="130" width="192" height="80" rx="12"/>
  <text class="title" x="816" y="156">HPA</text>
  <text class="sub" x="816" y="176">CPU target 50% of 100m</text>
  <text class="sub" x="816" y="192">min 1 · max 5 pods</text>
  <rect class="node" x="720" y="222" width="192" height="80" rx="12"/>
  <text class="title" x="816" y="248">Deployment</text>
  <text class="sub" x="816" y="268">100m–250m CPU per pod</text>
  <text class="sub" x="816" y="284">rolling update v1 → v2</text>

  <text class="sub" x="480" y="366">Self-healing: a deleted pod is replaced by the Deployment's ReplicaSet without anyone touching the cluster.</text>
</svg>
